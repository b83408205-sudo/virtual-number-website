<!doctype html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title or "Virtual Numbers" }}</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#f4f6fb;color:#182235;margin:0}
header{background:#14213d;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}
header a{color:white;text-decoration:none;margin-left:12px}
main{max-width:1000px;margin:24px auto;padding:0 14px}
.card{background:white;border:1px solid #e0e5ef;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px #14213d0a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
input,select,button{font:inherit;padding:11px;border:1px solid #cbd3e1;border-radius:8px;width:100%;box-sizing:border-box;margin:5px 0 12px}
button,.btn{background:#2457d6;color:white;border:0;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;padding:10px 14px;border-radius:8px}
.small{color:#596579;font-size:.92rem}.flash{background:#fff0c2;padding:10px;border-radius:8px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}th,td{text-align:right;padding:9px;border-bottom:1px solid #e4e8f0;white-space:nowrap}
.inline{display:inline-block;width:auto} .danger{background:#b42318}.muted{background:#5c667a}
</style></head><body><header><strong>Virtual Numbers</strong><nav><a href="{{ url_for('index') }}">ہوم</a><a href="{{ url_for('admin_login') }}">ایڈمن</a></nav></header>
<main>{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
